version: '3.8'

services:
  # СЕРВИС 1: БАЗА ДАННЫХ POSTGRESQL
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user # Имя пользователя БД
      POSTGRES_PASSWORD: pass # Пароль
      POSTGRES_DB: devicestats # Имя БД
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # СЕРВИС 2: REDIS (для очередей Celery)
  redis:
    image: redis:7
    ports:
      - '6379:6379'

  # СЕРВИС 3: НАШ API НА FASTAPI
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - '8000:8000'
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/devicestats

  # СЕРВИС 4: CELERY WORKER (фоновые задачи)
  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.celery
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/devicestats

  # СЕРВИС 5: НАГРУЗОЧНОЕ ТЕСТИРОВАНИЕ
  locust:
    image: locustio/locust
    ports:
      - '8089:8089'
    volumes:
      - ./tests:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host http://api:8000

volumes:
  postgres_data:
